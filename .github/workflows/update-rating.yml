name: Update Google Rating

on:
  schedule:
    # كل يوم أحد الساعة 6 صباحاً UTC (~9 صباحاً بتوقيت عمّان)
    - cron: '0 6 * * 0'
  workflow_dispatch: {}  # يسمح لك بتشغيله يدوياً من تبويب Actions لو حبيت

permissions:
  contents: write

jobs:
  update-rating:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest rating and update index.html
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: node scripts/update-rating.js

      - name: Commit changes if any
        run: |
          git config user.name "alreef-bot"
          git config user.email "actions@github.com"
          git diff --quiet index.html || (git add index.html && git commit -m "chore: auto-update Google rating" && git push)
